version: 2
updates:
  - package-ecosystem: gomod
    directory: /core
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    groups:
      gradle: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
